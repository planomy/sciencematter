<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Year 5 Science · Unit 3 · States of Matter</title>
<style>
  :root{
    --bg0:#0a121c; --bg1:#0f1828; --bg2:#152238;
    --ink:#f4f8fc; --ink-dim:#b4c4d4; --ink-faint:#7a90a8;
    --panel:#1a2a42; --panel2:#223350; --line:#3d5270;
    --chip-bg:#162032;
    --cream:#fef9e7; --cream-ink:#1e2a28;
    --amber:#f9d45d; --amber2:#ffe082;
    --accent:#5a9fd4; --accent2:#7eb8e8; --teal:#5a9fd4; --mint:#7eb8e8;
    --accent-on:#152238;
    --notice-bg:#e8f2fa; --notice-ink:#1a2d42; --notice-border:#7eb8e8;
    /* phase accents (from Lessons-Learned inspiration) */
    --p1:#ff5a6e; --p2:#7eb8e8; --p3:#5aa9ff; --p4:#b88bff; --p5:#ffb347;
    --radius:18px;
    --font: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--font); color:var(--ink);
    background:var(--bg0);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }

  /* ---------- Stage ---------- */
  #app{ width:100vw; height:100vh; display:flex; flex-direction:column; }
  #stageWrap{ flex:1; display:flex; align-items:center; justify-content:center; padding:18px 18px 6px; min-height:0; }
  .slide{
    position:relative; width:min(1180px,100%); aspect-ratio:16/10; max-height:100%;
    background:
      radial-gradient(1200px 500px at 80% -10%, rgba(90,159,212,.06), transparent 60%),
      linear-gradient(160deg,var(--bg1),var(--bg2) 60%, #101a28);
    border:1px solid var(--line); border-radius:26px;
    box-shadow:0 30px 80px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.04);
    padding:26px 38px 48px; overflow:hidden; display:flex; flex-direction:column;
  }

  /* eyebrow + title */
  .eyebrow{ display:inline-flex; align-items:center; gap:8px; align-self:flex-start;
    background:rgba(90,159,212,.10); color:var(--accent2); border:1px solid rgba(90,159,212,.28);
    font-weight:800; letter-spacing:.14em; text-transform:uppercase; font-size:12px;
    padding:7px 14px; border-radius:999px; }
  h1.title{ font-size:clamp(28px,3.6vw,46px); line-height:1.02; margin:10px 0 12px; letter-spacing:-.01em; }
  .slide.cover h1.title{ font-size:clamp(40px,6vw,76px); }

  /* generic two-column body */
  .cols{ display:grid; grid-template-columns:1fr 1fr; gap:14px; flex:1; min-height:0; }
  .cols.wide-left{ grid-template-columns:1.25fr .9fr; }
  .col{ display:flex; flex-direction:column; gap:10px; min-height:0; overflow:auto; }
  .col::-webkit-scrollbar{ width:6px; } .col::-webkit-scrollbar-thumb{ background:var(--line); border-radius:6px; }

  /* cream reading card */
  .card{ border-radius:var(--radius); padding:20px 22px; }
  .card.cream{ background:var(--cream); color:var(--cream-ink); box-shadow:0 10px 30px rgba(0,0,0,.25); overflow:auto; }
  .card.dark{ background:var(--panel); border:1px solid var(--line); }
  .tag{ display:inline-block; font-weight:900; font-size:12px; letter-spacing:.1em; text-transform:uppercase;
    background:var(--amber); color:#3a2c00; padding:5px 12px; border-radius:999px; margin-bottom:12px; }
  .tag.read{background:var(--amber)} .tag.wow{background:#ff6b8a;color:#3a0010}
  .tag.do{background:var(--mint);color:var(--accent-on)} .tag.try{background:#ffd766;color:#3a2c00}
  .card h3{ font-size:clamp(18px,2vw,24px); margin-bottom:8px; }
  .card.cream p, .card.cream li{ font-size:clamp(15px,1.45vw,19px); line-height:1.45; }
  .notice{ margin-top:12px; background:var(--notice-bg); border-left:5px solid var(--notice-border); color:var(--notice-ink);
    padding:10px 13px; border-radius:10px; font-size:14.5px; }
  .notice b{color:#2d5a7b}

  /* hook */
  .hook{ background:var(--panel2); border:1px solid var(--line); border-radius:var(--radius); padding:10px 15px; }
  .hook .lbl{ color:var(--amber2); font-weight:800; font-size:12px; letter-spacing:.08em; text-transform:uppercase; }
  .hook p{ font-size:clamp(15px,1.5vw,20px); margin-top:5px; line-height:1.3; }

  /* word power */
  .card.dark.wp{ padding:14px 16px; }
  .wp h4{ color:var(--ink); font-size:16px; margin-bottom:8px; }
  .wp-grid{ display:grid; grid-template-columns:1fr 1fr; gap:7px; }
  .chip{ background:var(--chip-bg); border:1px solid var(--line); border-radius:11px; padding:7px 10px; }
  .chip b{ display:block; font-size:14.5px; color:var(--mint); }
  .chip span{ font-size:12px; color:var(--ink-dim); line-height:1.25; }

  /* brain questions */
  .brain{ background:linear-gradient(150deg,var(--panel),var(--panel2)); border:1px solid var(--line); border-radius:var(--radius); padding:12px 16px; }
  .brain .lbl{ display:flex; align-items:center; gap:9px; color:var(--amber2); font-weight:800; letter-spacing:.06em; text-transform:uppercase; font-size:12px; margin-bottom:8px;}
  .brain ol{ list-style:none; display:flex; flex-direction:column; gap:7px; }
  .brain li{ display:flex; gap:10px; font-size:clamp(13.5px,1.35vw,17px); line-height:1.28; }
  .brain .n{ flex:none; width:24px; height:24px; border-radius:50%; display:grid; place-items:center;
    font-weight:900; font-size:13px; color:var(--accent-on); background:linear-gradient(135deg,var(--mint),var(--accent)); }


  .know-card h3{font-size:17px;margin:8px 0 6px}
  .know-list{margin:8px 0 0;padding-left:18px;font-size:14px;line-height:1.45;color:var(--cream-ink)}
  .know-list li{margin-bottom:6px}
  .discuss-card h3{font-size:17px}
  .discuss-list{list-style:none;display:flex;flex-direction:column;gap:8px;margin-top:10px;padding:0;margin-left:0}
  .discuss-list li{display:flex;gap:10px;font-size:14px;line-height:1.35}
  .discuss-list .n{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:11px;background:var(--chip-bg);border:1px solid var(--line)}
  .discuss-tip{margin-top:10px;font-size:13px;color:var(--ink-faint);font-style:italic}
  .sort-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
  .sort-col{background:var(--chip-bg);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13px}
  .sort-col b{display:block;margin-bottom:6px;color:var(--mint);font-size:12px;letter-spacing:.06em;text-transform:uppercase}

  /* steps / report builder */
  .steps{ background:var(--cream); color:var(--cream-ink); border-radius:var(--radius); padding:18px 20px; }
  .steps .tag{margin-bottom:14px}
  .steps .row{ display:flex; gap:14px; align-items:flex-start; padding:12px 0; border-bottom:1px dashed #d8cda6;}
  .steps .row:last-child{border-bottom:none}
  .steps .num{ flex:none; width:30px; height:30px; border-radius:50%; background:var(--panel2); color:var(--mint);
    display:grid; place-items:center; font-weight:900; }
  .steps .row b{ font-size:18px; display:block; }
  .steps .row span{ font-size:15px; color:#4a5a54; }


  /* 15-minute demonstrable win */
  .win15{
    background:linear-gradient(135deg, color-mix(in srgb, var(--mint, #3d9b8f) 18%, transparent), var(--panel2, var(--panel)));
    border:1px solid color-mix(in srgb, var(--mint, #3d9b8f) 45%, var(--line));
    border-radius:var(--radius); padding:12px 14px; margin-bottom:2px;
  }
  .win15 .lbl{
    font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
    color:var(--mint, #2a9d8f); margin-bottom:6px;
  }
  .win15 .can{
    font-family:inherit; font-size:clamp(16px,1.9vmin,22px); font-weight:800;
    letter-spacing:-.02em; line-height:1.25; margin:0 0 8px;
  }
  .win15 .prove{
    font-size:13.5px; color:var(--ink-dim, #4a5a54); line-height:1.4; margin:0;
  }
  .win15 .prove b{ color:var(--ink); }

  /* paced live-lesson blocks */
  .lesson-run{display:flex;flex-direction:column;gap:8px}
  .run-row{display:grid;grid-template-columns:72px 1fr;gap:10px;align-items:start;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .run-time{color:var(--amber2);font-weight:900;font-size:12px;letter-spacing:.04em}
  .run-row b{display:block;font-size:15px;margin-bottom:3px}
  .run-row span{font-size:13.5px;line-height:1.35;color:var(--ink-dim)}
  .response-call{border-radius:14px;padding:13px 15px;margin-top:2px;border:2px solid}
  .response-call.iboard{background:rgba(120,182,255,.12);border-color:#78b6ff}
  .response-call.onenote{background:rgba(114,213,176,.12);border-color:#72d5b0}
  .response-call .response-label{font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;margin-bottom:5px}
  .response-call.iboard .response-label{color:#a9d2ff}
  .response-call.onenote .response-label{color:#9aebcc}
  .response-call p{font-size:14px;line-height:1.4;margin:0}
  .scenario-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
  .scenario-tile{background:#f2e8d8;border:1px solid #dacbb7;border-radius:11px;padding:10px;color:var(--cream-ink);font-size:13.5px;line-height:1.35}
  .scenario-tile b{color:#245f6b}
  .option-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:8px;margin-top:8px}
  .option-card{background:#f2e8d8;border:1px solid #dacbb7;border-radius:12px;padding:11px;color:var(--cream-ink);font-size:13px;line-height:1.35}
  .option-card b{display:block;color:#245f6b;font-size:15px;margin-bottom:4px}

  /* exit check */
  .exit{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; }
  .exit h4{ font-size:20px; margin-bottom:12px; }
  .exit-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .echk{ display:flex; gap:10px; align-items:center; background:var(--chip-bg); border:1px solid var(--line);
    border-radius:12px; padding:10px 12px; font-size:14.5px; }
  .echk .bx{ flex:none; width:24px;height:24px;border-radius:7px;background:var(--mint);color:var(--accent-on);
    display:grid;place-items:center;font-weight:900; }

  /* particle diagrams */
  .particles{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  .pcell{ background:var(--chip-bg); border:1px solid var(--line); border-radius:14px; padding:12px; text-align:center;}
  .pcell .box{ height:96px; border:1px dashed var(--line); border-radius:10px; position:relative; overflow:hidden; margin-bottom:8px;}
  .pcell b{font-size:15px;color:var(--mint)} .pcell small{color:var(--ink-dim);font-size:12.5px}
  .dot{ position:absolute; width:13px;height:13px;border-radius:50%;
    background:radial-gradient(circle at 30% 30%, #b8d8f0, var(--accent)); }

  /* images */
  .imgframe{ border-radius:14px; overflow:hidden; border:1px solid var(--line); position:relative; background:var(--chip-bg); flex:none; }
  .imgframe img{ display:block; width:100%; height:clamp(110px,15vh,172px); object-fit:cover; }
  .imgframe .cap{ position:absolute; left:0; right:0; bottom:0;
    background:linear-gradient(transparent, rgba(10,18,28,.92)); color:#e8f0f8; font-size:12.5px; padding:18px 12px 8px; font-weight:600; }
  .imgrow{ display:grid; grid-template-columns:repeat(4,1fr); gap:9px; }
  .imgrow .ic{ background:var(--chip-bg); border:1px solid var(--line); border-radius:11px; overflow:hidden; text-align:center; }
  .imgrow .ic img{ width:100%; height:72px; object-fit:cover; display:block; }
  .imgrow .ic b{ display:block; font-size:12.5px; color:var(--mint); padding:5px 3px; }

  /* simple data table */
  table.dt{ width:100%; border-collapse:collapse; font-size:15px; }
  table.dt th, table.dt td{ border:1px solid var(--line); padding:8px 10px; text-align:left; }
  table.dt th{ background:var(--panel2); color:var(--mint); }
  .card.cream table.dt th{ background:#efe6c8; color:#3a2c00;}
  .card.cream table.dt th, .card.cream table.dt td{ border-color:#d8cda6;}

  /* word bank pills */
  .bank{ display:flex; flex-wrap:wrap; gap:8px; margin:8px 0 4px;}
  .bank span{ background:var(--chip-bg);border:1px solid var(--line);color:var(--mint);
    padding:6px 12px;border-radius:999px;font-weight:700;font-size:14px;}

  /* cover */
  .slide.cover{ align-items:flex-start; justify-content:center; text-align:left; }
  .cover .sub{ font-size:clamp(18px,2.2vw,26px); color:var(--ink-dim); max-width:760px; line-height:1.4;}
  .cover .meta{ margin-top:auto; display:flex; gap:22px; flex-wrap:wrap; color:var(--ink-faint); font-weight:700; letter-spacing:.05em;}
  .cover .pill{ background:rgba(90,159,212,.10); border:1px solid rgba(90,159,212,.25); color:var(--mint); padding:8px 16px; border-radius:999px;}

  /* phase divider */
  .slide.divider{ justify-content:center; }
  .divider .pkr{ font-size:clamp(20px,3vw,30px); color:var(--ink-dim); font-weight:800; letter-spacing:.2em; text-transform:uppercase;}
  .divider h1{ font-size:clamp(40px,6vw,72px); margin:10px 0 18px;}
  .divider .goals{ display:flex; flex-direction:column; gap:12px; max-width:840px;}
  .divider .goal{ display:flex; gap:14px; align-items:center; font-size:clamp(17px,1.9vw,22px); background:var(--panel); border:1px solid var(--line); padding:14px 18px; border-radius:14px;}
  .divider .goal i{ flex:none; width:34px;height:34px;border-radius:10px; display:grid;place-items:center;font-style:normal;font-weight:900;color:var(--accent-on);}

  /* assessment checkpoint slide */
  .slide.checkpoint{ justify-content:center; text-align:center; align-items:center;}
  .checkpoint h1{font-size:clamp(34px,5vw,60px)}
  .checkpoint p{font-size:clamp(18px,2vw,24px); color:var(--ink-dim); max-width:780px; margin:14px auto 24px;}

  .corner{ position:absolute; right:26px; bottom:18px; color:var(--ink-faint); font-size:12px; letter-spacing:.08em;}
  .corner kbd{ background:var(--chip-bg);border:1px solid var(--line); border-radius:6px; padding:2px 7px; font-size:11px;}
  .screenlbl{ position:absolute; left:38px; bottom:18px; color:var(--ink-faint); font-size:12px; letter-spacing:.12em; text-transform:uppercase;}
  .eyebrow-r{ position:absolute; right:38px; top:30px; color:var(--ink-faint); font-size:12px; font-weight:800; letter-spacing:.14em; text-transform:uppercase;}

  /* Present mode — scale slide to fill viewport (Teams / laptop share) */
  html.presenting body,html:fullscreen body{align-items:stretch;justify-content:stretch;background:var(--bg1);}
  html.presenting #app,html:fullscreen #app{height:100dvh;}
  html.presenting #nav,html:fullscreen #nav{flex-shrink:0;padding:8px 10px;background:var(--bg0);border-top:1px solid var(--line);}
  html.presenting #stageWrap,html:fullscreen #stageWrap{
    padding:0;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;
    background:var(--bg1);
  }
  html.presenting .slide,html:fullscreen .slide{
    width:1180px;height:738px;max-width:none;max-height:none;aspect-ratio:auto;flex-shrink:0;
    border-radius:0;border:none;box-shadow:none;
    padding:26px 38px 48px;
    transform-origin:center center;
  }
  html.presenting .corner,html.presenting .screenlbl,html:fullscreen .corner,html:fullscreen .screenlbl{display:none;}
  html.presenting .cols,html:fullscreen .cols{flex:1;min-height:0;align-items:stretch;}
  html.presenting .col,html:fullscreen .col{height:100%;}
  html.presenting .col > .card.cream,html.presenting .col > .steps,html.presenting .col > .brain,html.presenting .col > .hook,html.presenting .col > .imgframe,html.presenting .col > .imgrow,
  html:fullscreen .col > .card.cream,html:fullscreen .col > .steps,html:fullscreen .col > .brain,html:fullscreen .col > .hook,html:fullscreen .col > .imgframe,html:fullscreen .col > .imgrow{
    flex:1 1 0;min-height:0;max-height:none;overflow:auto;
  }
  html.presenting .col > .exit,html:fullscreen .col > .exit{flex:0 0 auto;}

  /* ---------- Nav bar ---------- */
  #nav{ display:flex; align-items:center; justify-content:center; gap:10px; padding:10px; }
  .btn{ background:var(--panel2); color:var(--ink); border:1px solid var(--line); border-radius:999px;
    padding:9px 16px; font-weight:700; font-size:14px; cursor:pointer; display:inline-flex; align-items:center; gap:7px; }
  .btn:hover{ border-color:var(--mint); color:#fff;}
  .btn.primary{ background:var(--mint); color:var(--accent-on); border-color:var(--mint);}
  .btn.assess{ background:linear-gradient(135deg,var(--amber),#ff9d3c); color:#3a2400; border:none; font-weight:900;}
  .btn.notes-open{border-color:var(--mint);color:#fff;box-shadow:0 0 0 1px rgba(126,184,232,.35);}
  #counter{ font-weight:800; color:var(--ink-dim); min-width:74px; text-align:center; }
  select#jump{ background:var(--panel2); color:var(--ink); border:1px solid var(--line); border-radius:999px; padding:9px 12px; font-size:13px; max-width:230px; }

  /* ---------- Teacher notes panel ---------- */
  #tnotes{ position:fixed; right:0; top:0; height:100%; width:min(440px,90vw); transform:translateX(100%);
    transition:transform .28s ease; background:var(--bg1); border-left:1px solid var(--line); z-index:40;
    box-shadow:-20px 0 60px rgba(0,0,0,.5); display:flex; flex-direction:column;}
  #tnotes.open{ transform:none;}
  html.presenting #tnotes,html:fullscreen #tnotes{z-index:100;height:100dvh;}
  #tnotes header{ padding:18px 20px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap:12px; flex-shrink:0;}
  #tnotes header b{ color:var(--amber2); letter-spacing:.04em;}
  #tnotes header .slide-label{display:block;font-size:12px;font-weight:700;color:var(--ink-faint);letter-spacing:.06em;text-transform:uppercase;margin-top:4px;}
  #tnotes .body{ padding:20px; overflow:auto; flex:1; min-height:0; font-size:15.5px; line-height:1.55; color:var(--ink-dim);}
  #tnotes .body h4{color:var(--mint); margin:14px 0 6px; font-size:16px;}
  #tnotes .body ul{margin:6px 0 6px 18px;}
  #tnotes .body li{margin:4px 0;}

  /* ---------- Assessment overlay ---------- */
  #overlay{ position:fixed; inset:0; background:rgba(8,14,18,.84); backdrop-filter:blur(6px); z-index:60;
    display:none; align-items:center; justify-content:center; padding:24px;}
  #overlay.open{display:flex;}
  .modal{ width:min(1100px,100%); height:min(88vh,820px); background:linear-gradient(160deg,var(--bg1),var(--bg2));
    border:1px solid var(--line); border-radius:22px; display:flex; flex-direction:column; overflow:hidden; box-shadow:0 40px 100px rgba(0,0,0,.6);}
  .modal header{ padding:16px 22px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:14px;}
  .modal header h2{ font-size:22px; margin-right:auto;}
  .tabs{ display:flex; gap:8px;}
  .tab{ background:var(--panel2); border:1px solid var(--line); color:var(--ink-dim); padding:8px 16px; border-radius:999px; cursor:pointer; font-weight:700; font-size:14px;}
  .tab.active{ background:var(--amber); color:#3a2400; border-color:var(--amber);}
  .modal .content{ padding:24px; overflow:auto; flex:1;}
  .modal .content h3{ color:var(--mint); margin:18px 0 8px; font-size:20px;}
  .modal .content h3:first-child{margin-top:0}
  .modal .content p, .modal .content li{ font-size:16px; line-height:1.55; color:var(--ink); }
  .modal .content ul{margin:6px 0 6px 20px}
  .panelpane{display:none} .panelpane.active{display:block}
  .rubric{ width:100%; border-collapse:collapse; font-size:13px; margin-top:8px;}
  .rubric th,.rubric td{ border:1px solid var(--line); padding:8px; vertical-align:top; text-align:left;}
  .rubric th{ background:var(--panel2); color:var(--amber2);}
  .rubric td:first-child{ background:var(--chip-bg); color:var(--mint); font-weight:800; width:150px;}
  .rubric .A{background:rgba(126,184,232,.06)}
  .assess-doc .assess-open{ margin-bottom:12px; }
  .assess-doc .assess-open a{ color:var(--amber2); font-weight:800; }
  #pane-task.active{ display:flex; flex-direction:column; min-height:0; flex:1; }
  .assess-pdfFrame{ flex:1; min-height:min(68vh,640px); border-radius:14px; overflow:hidden; border:1px solid var(--line); background:var(--bg0); }
  .assess-pdfFrame iframe{ width:100%; height:100%; border:0; display:block; min-height:min(68vh,640px); }
  .modal footer{ padding:14px 22px; border-top:1px solid var(--line); display:flex; justify-content:space-between; align-items:center;}
  .hint{color:var(--ink-faint); font-size:13px;}

  @media (max-width:720px){
    .cols{grid-template-columns:1fr; overflow:auto;}
    .wp-grid,.exit-grid{grid-template-columns:1fr;}
    select#jump{max-width:130px;}
  }
</style>
</head>
<body>
<div id="app">
  <div id="stageWrap"><div class="slide" id="slide"></div></div>

  right:[{k:'html',html:`<div class="lesson-run"><div class="run-row"><div class="run-time">30–33</div><div><b>Set up or inspect</b><span>Identify the one planned difference and three things intended to stay the same.</span></div></div><div class="run-row"><div class="run-time">33–40</div><div><b>Observe</b><span>Record direct observations at the agreed checkpoints; do not invent exact measurements.</span></div></div><div class="run-row"><div class="run-time">40–43</div><div><b>Compare</b><span>Describe which cube changed more and cite one observation.</span></div></div><div class="run-row"><div class="run-time">43–45</div><div><b>Explain</b><span>Connect the comparison to energy transfer and particle movement.</span></div></div></div><div class="response-call iboard"><div class="response-label">iBoard check 3 · observation evidence</div><p>Post: <b>planned difference / three things kept the same / one direct observation / particle-and-energy explanation</b>. If using teacher data, label it.</p></div>`}],
  notes:`<h4>Timing: minutes 30–45</h4><p>30–33 set-up; 33–40 observation; 40–43 comparison; 43–45 iBoard.</p><h4>Pacing and safety</h4><p>The ice does not need to melt completely. The goal is careful comparison, not a finished investigation. Students without safe equipment use teacher-supplied observations.</p><h4>Scientific caution</h4><p>Say the warmer location likely transferred energy faster under these conditions; do not claim sunlight is the only possible cause if other conditions differed.</p>` });

SLIDES.push({ nav:'L9A — A question a test can answer',
  eyebrow:'Week 5 · Lesson 9 · Learn / Read / Notice', eyebrowR:'Lesson 9 · Screen A',
  title:'From a wondering to a <i>testable</i> question',
  screenlbl:'Student screen 1 of 4', wideLeft:true,
  left:[{k:'read', heading:'A scientific question has moving parts', body:[
    'A <b>scientific wondering</b> can be broad: “Why does ice disappear?” A <b>testable question</b> is narrower. It names the one factor you will change and the outcome you will measure. It must also be safe and possible with the time and equipment you have.',
    'Use this frame: <b>How does [the thing I change] affect [the thing I measure], measured in [units]?</b> For example: “How does location — sun or shade — affect the time in minutes for equal ice cubes to melt?”'

  {k:'html',html:`<div class="card cream"><span class="tag try">QUESTION ANATOMY</span><div class="scenario-grid">
    <div class="scenario-tile"><b>Change</b>Location: sun or shade</div><div class="scenario-tile"><b>Measure</b>Melting time</div>
    <div class="scenario-tile"><b>Unit</b>Minutes and seconds</div><div class="scenario-tile"><b>Compare fairly</b>Equal ice cubes</div></div></div>`}],
  right:[{k:'win15', can:'tell whether a question is testable', prove:'Name what changes, what is measured and the unit.'},
    {k:'html',html:`<div class="lesson-run"><div class="run-row"><div class="run-time">0–3 min</div><div><b>Notice</b><span>What is the difference between “Why is ice cold?” and the sun/shade question?</span></div></div><div class="run-row"><div class="run-time">3–8 min</div><div><b>Read and unpack</b><span>Find the change, measurement, unit and fair comparison in the model.</span></div></div><div class="run-row"><div class="run-time">8–12 min</div><div><b>Repair it</b><span>Rewrite “Ice melts quickly” as a question a class could actually test.</span></div></div><div class="run-row"><div class="run-time">12–15 min</div><div><b>Submit</b><span>Post your repaired question and label its parts.</span></div></div></div>
      <div class="response-call iboard"><div class="response-label">iBoard check 1 · everyone responds</div><p>Rewrite <b>“Ice melts quickly”</b> as a testable question. Then add: <b>change = … / measure = … / unit = …</b></p></div>`}],
  notes:`<h4>Timing: 15 minutes</h4><p>0–3 hook; 3–8 explicit teaching; 8–12 repair; 12–15 iBoard response.</p><h4>Listen for</h4><p>A question—not a prediction—with one change and a measurable outcome. Accept melting time in seconds or minutes.</p><h4>Evidence sweep</h4><p>Scan iBoard for all three labels. Follow up students who post a broad wondering, change two factors, or omit a unit.</p>` });

SLIDES.push({ nav:'L9B — Build your question',
  eyebrow:'Week 5 · Lesson 9 · Question clinic', eyebrowR:'Lesson 9 · Screen B',
  title:'Question clinic: test it, reject it, repair it',
  screenlbl:'Student screen 2 of 4', wideLeft:true,
  left:[{k:'html',html:`<div class="card cream"><span class="tag do">SIX QUESTIONS</span><div class="scenario-grid">
    <div class="scenario-tile"><b>1</b>Why is ice cold?</div><div class="scenario-tile"><b>2</b>Does adding 5 g of salt change melting time?</div>
    <div class="scenario-tile"><b>3</b>Which ice cube is best?</div><div class="scenario-tile"><b>4</b>Does crushed ice melt faster than a whole cube?</div>
    <div class="scenario-tile"><b>5</b>What happens to ice?</div><div class="scenario-tile"><b>6</b>How does the surface material affect melting time?</div></div></div>`},
    {k:'read',heading:'The question clinic rules',body:['A question is not strong merely because it ends with a question mark. Ask: <b>Can I deliberately change one factor? Can I measure the result? Can I keep the comparison safe and fair?</b>','Question 4 is testable, but it hides a fairness trap: crushed ice and a whole cube must start with the <b>same mass</b>. Question 6 needs named surfaces and a unit before it is fully ready.'],notice:'A testable idea can still need repairing before it becomes a strong investigation question.'}],
  right:[{k:'html',html:`<div class="lesson-run"><div class="run-row"><div class="run-time">15–19</div><div><b>Silent sort</b><span>Mark each question T (testable now), R (repair) or U (unsuitable for this test).</span></div></div><div class="run-row"><div class="run-time">19–24</div><div><b>Defend</b><span>Choose two and explain your judgement using change, measure, unit or fairness.</span></div></div><div class="run-row"><div class="run-time">24–28</div><div><b>Repair</b><span>Upgrade questions 3 and 5 so they name a change and melting-time measurement.</span></div></div><div class="run-row"><div class="run-time">28–30</div><div><b>Submit</b><span>Post your classification and strongest repair.</span></div></div></div>
    <div class="response-call iboard"><div class="response-label">iBoard check 2 · question diagnosis</div><p>Post <b>1–6 as T, R or U</b>. Then repair either question 3 or 5 and label its <b>independent variable (IV)</b> and <b>dependent variable (DV)</b>.</p></div>`}],
  notes:`<h4>Timing: minutes 15–30</h4><p>15–19 classify; 19–24 justify; 24–28 repair; 28–30 iBoard.</p><h4>Suggested judgements</h4><p>1 U/R; 2 T (if unit added to outcome); 3 R; 4 R because equal starting mass must be stated; 5 R; 6 R because surfaces and units need specifying. Reward defensible reasoning over a rigid letter.</p><h4>Evidence sweep</h4><p>Look for the causal structure: IV affects DV. Students should not list melting time as the IV.</p>` });

SLIDES.push({ nav:'L9C — Prediction craft',
  eyebrow:'Week 5 · Lesson 9 · Evidence / Explain / Improve', eyebrowR:'Lesson 9 · Screen C',
  title:'A prediction is more than a guess',
  screenlbl:'Student screen 3 of 4', wideLeft:true,
  left:[{k:'read',heading:'Direction + comparison + science reason',body:['A <b>prediction</b> states the pattern you expect before seeing the results. A strong prediction names which condition will melt faster or slower and explains why using science. You do not need to invent an exact time unless earlier evidence supports it.','Useful science ideas depend on the investigation: sunlight transfers more energy to the ice; crushing exposes more surface area; insulation can slow energy transfer; salt changes the temperature at which water freezes and encourages melting at the ice surface.'],notice:'Strong: “I predict X will melt in less time than Y because [relevant science mechanism].”'},
    {k:'html',html:`<div class="card cream"><span class="tag try">WEAK → STRONG</span><p><b>Weak:</b> The salty one will win.</p><p><b>Better:</b> The salted cube will melt faster.</p><p><b>Strong:</b> I predict the cube with 5 g of salt will melt in less time than the cube with no salt because salt lowers the freezing point of water and promotes melting at the surface.</p></div>`}],
  right:[{k:'html',html:`<div class="lesson-run"><div class="run-row"><div class="run-time">30–34</div><div><b>Compare</b><span>Underline what improves from weak to strong in the model.</span></div></div><div class="run-row"><div class="run-time">34–39</div><div><b>Match reasons</b><span>Connect sun/shade, crushed/whole, wrapped/unwrapped and salt/no salt to the correct science idea.</span></div></div><div class="run-row"><div class="run-time">39–43</div><div><b>Upgrade</b><span>Improve: “The sunny ice melts quick because it is hot.” Make the comparison precise.</span></div></div><div class="run-row"><div class="run-time">43–45</div><div><b>Submit</b><span>Post the improved sentence and identify its science mechanism.</span></div></div></div>
    <div class="response-call iboard"><div class="response-label">iBoard check 3 · prediction upgrade</div><p>Improve <b>“The sunny ice melts quick because it is hot.”</b> Your sentence must name both conditions, expected direction and a heat-energy reason.</p></div>`}],
  notes:`<h4>Timing: minutes 30–45</h4><p>30–34 compare models; 34–39 match mechanisms; 39–43 upgrade; 43–45 iBoard.</p><h4>Model answer</h4><p>I predict the equal ice cube in sunlight will melt in less time than the cube in shade because it receives more radiant energy, increasing particle motion until the solid changes to liquid.</p><h4>Misconception alert</h4><p>Do not require invented exact times. Measurable refers to an outcome that can be measured, not a fabricated number.</p>` });

  eyebrow:'Week 5 · Lesson 9 · Create / Check / Submit', eyebrowR:'Lesson 9 · Screen D',

SLIDES.push({ nav:'L10A — What makes a test FAIR?',
  eyebrow:'Week 5 · Lesson 10 · Learn / Read / Notice', eyebrowR:'Lesson 10 · Screen A',
  title:'Fair, valid and reliable are not the same',
  screenlbl:'Student screen 1 of 4', wideLeft:true,
  left:[{k:'read',wow:true,heading:'The deliberately terrible ice test',body:['A student asks whether salt changes melting time. They put a <b>small salted cube on a metal tray in sunlight</b> and a <b>large unsalted cube on a plastic plate in shade</b>. The salted cube melts first. Can the student claim salt caused the result? No—size, surface and location also changed.','A test is <b>fair</b> when only the independent variable changes. It is <b>valid</b> when the method actually answers the question. It becomes more <b>reliable</b> when repeated trials give a similar pattern.'],notice:'Fair: one change. Valid: answers the question. Reliable: repeated evidence agrees.'},
    {k:'html',html:`<div class="card cream"><span class="tag try">CAUSE OR CONFUSION?</span><p>Possible causes of faster melting: <b>salt · smaller mass · metal surface · sunlight</b>. Because four factors changed, the evidence cannot isolate salt.</p></div>`}],
  right:[{k:'html',html:`<div class="lesson-run"><div class="run-row"><div class="run-time">0–4 min</div><div><b>Spot the flaws</b><span>List every difference between the two cubes.</span></div></div><div class="run-row"><div class="run-time">4–9 min</div><div><b>Learn</b><span>Sort each idea under fair, valid or reliable.</span></div></div><div class="run-row"><div class="run-time">9–13 min</div><div><b>Repair</b><span>Redesign the terrible test so salt is the only planned difference.</span></div></div><div class="run-row"><div class="run-time">13–15 min</div><div><b>Submit</b><span>Name the variables and explain why the original claim was weak.</span></div></div></div>
    <div class="response-call iboard"><div class="response-label">iBoard check 1 · fairness diagnosis</div><p>Post: <b>IV / DV + unit / four controls / why the original test cannot prove salt caused the result</b>.</p></div>`}],
  notes:`<h4>Timing: 15 minutes</h4><p>0–4 flaw hunt; 4–9 teach terms; 9–13 repair; 13–15 iBoard.</p><h4>Answer guide</h4><p>IV should be salt amount or salt/no salt; DV is melting time in min:s; controls can include starting mass, starting temperature, surface, location, container and start time. The original is confounded because several variables changed.</p>` });

SLIDES.push({ nav:'L10B — Plan your variables',
  eyebrow:'Week 5 · Lesson 10 · Specify / Plan / Defend', eyebrowR:'Lesson 10 · Screen B',
  title:'Turn “keep it the same” into a precise plan',
  screenlbl:'Student screen 2 of 4', wideLeft:true,
  left:[{k:'html',html:`<div class="card cream"><span class="tag try">VARIABLES LAB</span><table class="dt"><tr><th>Role</th><th>Vague</th><th>Precise</th></tr><tr><td><b>Change</b></td><td>salt</td><td>0 g or 5 g table salt</td></tr><tr><td><b>Measure</b></td><td>melting</td><td>time until no solid ice remains, min:s</td></tr><tr><td><b>Control</b></td><td>same ice</td><td>20 g cubes from the same freezer, removed together</td></tr><tr><td><b>Repeat</b></td><td>do it again</td><td>3 trials for each condition</td></tr></table></div>`},
    {k:'read',heading:'Why precision matters',body:['“Same size” sounds fair, but two cubes can look alike and have different masses. A controlled variable becomes useful when the method says <b>how</b> it will be kept constant.','Repeats do not repair an unfair test. First make every comparison fair; then repeat each condition enough times to see whether the pattern is consistent.'],notice:'Name each control and state exactly how you will hold it constant.'}],
  right:[{k:'html',html:`<div class="lesson-run"><div class="run-row"><div class="run-time">15–19</div><div><b>Upgrade</b><span>Turn “same ice, same place, same timer” into measurable controls.</span></div></div><div class="run-row"><div class="run-time">19–24</div><div><b>Apply</b><span>Open your Lesson 9 question. Identify its IV and DV with exact conditions and units.</span></div></div><div class="run-row"><div class="run-time">24–28</div><div><b>Control</b><span>Write at least four controls and how each will be kept the same.</span></div></div><div class="run-row"><div class="run-time">28–30</div><div><b>Reliability</b><span>Add three trials per condition and post your plan.</span></div></div></div>
    <div class="response-call iboard"><div class="response-label">iBoard check 2 · your variable plan</div><p>For your Lesson 9 question, post: <b>IV with conditions / DV + unit / four precise controls / number of trials</b>.</p></div>`}],
  notes:`<h4>Timing: minutes 15–30</h4><p>15–19 precision upgrade; 19–24 IV/DV; 24–28 controls; 28–30 iBoard.</p><h4>Evidence sweep</h4><p>Flag students whose IV contains two changes, whose DV has no unit or endpoint, or whose controls are nouns without a method for keeping them constant.</p>` });

SLIDES.push({ nav:'L10C — Method builder',
  eyebrow:'Week 5 · Lesson 10 · Sequence / Specify / Repeat', eyebrowR:'Lesson 10 · Screen C',
  title:'Write a method another scientist can repeat',

SLIDES.push({ nav:'L10D — Risk & fairness check',
  eyebrow:'Week 5 · Lesson 10 · Audit / Protect / Submit', eyebrowR:'Lesson 10 · Screen D',
  title:'The pre-investigation safety and quality audit',
  screenlbl:'Student screen 4 of 4', wideLeft:true,

  notes:`<h4>Timing: minutes 45–60</h4><p>45–49 risk scan; 49–56 OneNote plan; 56–58 partner audit; 58–60 iBoard exit.</p><h4>Evidence sweep</h4><p>OneNote provides the full planning evidence; iBoard shows who can explain the logic independently. Do not approve testing until IV conditions, endpoint, key controls and realistic risk controls are clear.</p><h4>Reliability answer</h4><p>Repeats reveal unusual results and show whether the same pattern occurs consistently; they do not make an unfair design fair.</p>` });

SLIDES.push({ nav:'L11A — Measure like a scientist',
  eyebrow:'Week 6 · Lesson 11 · Learn / Read / Notice', eyebrowR:'Lesson 11 · Screen A',
  title:'The same experiment can produce different data',
  screenlbl:'Student screen 1 of 4', wideLeft:true,
  left:[{k:'read', heading:'Measurement rules must be agreed before testing', body:[
    'Imagine two students time the same ice cube. One starts the timer when the cube leaves the freezer; the other starts when it touches the tray. One stops when a puddle appears; the other waits until <b>no solid ice remains</b>. Their numbers disagree because their measurement rules disagree.',
    '<b>Accuracy</b> improves when the correct tool is used carefully. <b>Precision</b> means recording to a consistent level of detail, such as the nearest second. <b>Reliability</b> is about whether repeated trials show a similar pattern. These ideas are connected, but they are not interchangeable.'
  ], notice:'A fair method needs one start rule, one observable endpoint, one unit and one recording routine.'},
  {k:'html',html:`<div class="card cream"><span class="tag try">FOUR DECISIONS</span><div class="scenario-grid"><div class="scenario-tile"><b>Start</b>When both cubes touch their trays</div><div class="scenario-tile"><b>Stop</b>When no solid ice remains</div><div class="scenario-tile"><b>Precision</b>Nearest second</div><div class="scenario-tile"><b>Record</b>Immediately in the results table</div></div></div>`}],
  right:[{k:'html',html:`<div class="lesson-run"><div class="run-row"><div class="run-time">0–3 min</div><div><b>Spot the disagreement</b><span>Why could two careful people get different times for the same cube?</span></div></div><div class="run-row"><div class="run-time">3–8 min</div><div><b>Learn the terms</b><span>Distinguish accurate, precise and reliable using the reading.</span></div></div><div class="run-row"><div class="run-time">8–12 min</div><div><b>Write rules</b><span>Create one start, stop, unit and recording rule for an ice test.</span></div></div><div class="run-row"><div class="run-time">12–15 min</div><div><b>Diagnose</b><span>Explain the likely error in three measurement scenarios.</span></div></div></div>
    <div class="response-call iboard"><div class="response-label">iBoard check 1 · measurement diagnosis</div><p>Student A records <b>“about 5 minutes”</b>; B records <b>5:17</b>; C starts timing 30 seconds late. Which result is least precise? Which is least accurate? Explain.</p></div>`}],
  notes:`<h4>Timing: 15 minutes</h4><p>0–3 hook; 3–8 explicit teaching; 8–12 measurement rules; 12–15 iBoard.</p><h4>Answer guide</h4><p>A is least precise because it is rounded vaguely. C is likely least accurate because the late start causes a systematic underestimate. B is precise, but precision alone cannot prove accuracy.</p><h4>Evidence sweep</h4><p>Look for students who use accurate, precise and reliable as synonyms; address this before practical work.</p>` });

SLIDES.push({ nav:'L11B — Build your results table',
  eyebrow:'Week 6 · Lesson 11 · Organise / Calculate / Check', eyebrowR:'Lesson 11 · Screen B',
  title:'Build a table that prevents lost data',
  screenlbl:'Student screen 2 of 4', wideLeft:true,
  left:[{k:'html', html:`<div class="card cream"><span class="tag try">SAMPLE RESULTS</span><table class="dt"><tr><th>Salt condition</th><th>Trial 1 (s)</th><th>Trial 2 (s)</th><th>Trial 3 (s)</th><th>Mean (s)</th></tr><tr><td>0 g</td><td>700</td><td>680</td><td>690</td><td>690</td></tr><tr><td>5 g</td><td>500</td><td>520</td><td>510</td><td>510</td></tr></table><p style="color:#4a5a54;font-size:13.5px;margin-top:8px">690 s = 11 min 30 s. &nbsp; 510 s = 8 min 30 s.</p></div>`},
    {k:'read',heading:'Why use total seconds?',body:['Times written as minutes:seconds cannot be averaged as if the colon were a decimal point. Convert every time to <b>total seconds</b>, add the trials, divide by the number of trials, then convert back if needed.','A useful table puts the <b>independent variable and its conditions</b> in the first column. Each measurement heading names the dependent variable and includes its unit. Record every result—even one that looks surprising.'],notice:'Mean = total of the trial values ÷ number of trials. Keep the unit attached.'}],
  right:[{k:'html',html:`<div class="lesson-run"><div class="run-row"><div class="run-time">15–19</div><div><b>Read the table</b><span>Identify IV conditions, DV, unit, repeats and mean.</span></div></div><div class="run-row"><div class="run-time">19–24</div><div><b>Convert</b><span>Change 4:35, 5:05 and 4:50 into total seconds.</span></div></div><div class="run-row"><div class="run-time">24–28</div><div><b>Calculate</b><span>Find the mean of the three times, then convert it back to min:s.</span></div></div><div class="run-row"><div class="run-time">28–30</div><div><b>Justify</b><span>Explain why units belong in headings, not scattered through cells.</span></div></div></div>
    <div class="response-call iboard"><div class="response-label">iBoard check 2 · data calculation</div><p>For <b>4:35, 5:05 and 4:50</b>, post the three values in seconds, the calculation and the mean in both seconds and min:s.</p></div>`}],
  notes:`<h4>Timing: minutes 15–30</h4><p>15–19 table anatomy; 19–24 conversions; 24–28 mean; 28–30 iBoard.</p><h4>Answer</h4><p>275 s, 305 s and 290 s. (275 + 305 + 290) ÷ 3 = 290 s = 4 min 50 s.</p><h4>Common error</h4><p>Students may calculate (4.35 + 5.05 + 4.50) ÷ 3. Re-teach that 4:35 is not 4.35 minutes.</p>` });

SLIDES.push({ nav:'L11C — Data habits',
  eyebrow:'Week 6 · Lesson 11 · Observe / Infer / Investigate', eyebrowR:'Lesson 11 · Screen C',
  title:'Odd data is a clue—not rubbish',
  screenlbl:'Student screen 3 of 4', wideLeft:true,
  left:[{k:'read',heading:'Observation, inference and anomaly',body:['An <b>observation</b> reports what was directly seen or measured: “Trial 2 took 920 s.” An <b>inference</b> offers a possible explanation: “The cube may have been larger.” The inference may be sensible, but it is not a measured fact.','An <b>anomaly</b> is a result noticeably different from the others. Scientists keep it, check the procedure and repeat the test. They only exclude data when they can give a recorded, defensible reason—such as the timer stopping unexpectedly.'],notice:'Never secretly delete an inconvenient value. Record it, investigate it and explain any decision.'},
    {k:'html',html:`<div class="card cream"><span class="tag do">DATA DETECTIVE</span><table class="dt"><tr><th>Trial</th><th>0 g salt (s)</th><th>5 g salt (s)</th></tr><tr><td>1</td><td>700</td><td>500</td></tr><tr><td>2</td><td>920</td><td>520</td></tr><tr><td>3</td><td>690</td><td>510</td></tr></table><p>Trial 2 for 0 g salt is unusual. What should happen next?</p></div>`}],
  right:[{k:'html',html:`<div class="lesson-run"><div class="run-row"><div class="run-time">30–34</div><div><b>Notice</b><span>Describe the odd result without explaining it yet.</span></div></div><div class="run-row"><div class="run-time">34–38</div><div><b>Separate</b><span>Classify six statements as observation or inference.</span></div></div><div class="run-row"><div class="run-time">38–42</div><div><b>Investigate</b><span>List possible causes and the evidence needed to check each one.</span></div></div><div class="run-row"><div class="run-time">42–45</div><div><b>Decide honestly</b><span>Write what to do now and what not to do.</span></div></div></div>
    <div class="response-call iboard"><div class="response-label">iBoard check 3 · anomaly protocol</div><p>Post: <b>observation / one possible inference / next action / why deleting 920 s without evidence would be poor science</b>.</p></div>`}],
  notes:`<h4>Timing: minutes 30–45</h4><p>30–34 observe; 34–38 sort; 38–42 investigate; 42–45 iBoard.</p><h4>Model response</h4><p>Observation: trial 2 is 220–230 s longer than the other 0 g trials. Inference: the cube may have had a greater starting mass. Next: check notes/equipment and run another trial under the same controls. It cannot be deleted merely because it is inconvenient.</p>` });

SLIDES.push({ nav:'L11D — Observation vs inference',
  eyebrow:'Week 6 · Lesson 11 · Prepare / Audit / Submit', eyebrowR:'Lesson 11 · Screen D',
  title:'Create your data-collection protocol',
  screenlbl:'Student screen 4 of 4', wideLeft:true,
  left:[{k:'html',html:`<div class="card cream"><span class="tag do">ONENOTE EVIDENCE · USE THESE HEADINGS</span><ol style="line-height:1.58;margin:10px 0 0 20px"><li><b>My measurement rule</b> — start, stop, tool, unit and precision.</li><li><b>My blank results table</b> — IV conditions, three trials and mean; units in headings.</li><li><b>My calculation example</b> — convert min:s to seconds and find a mean.</li><li><b>My observation notes</b> — what will be recorded besides time?</li><li><b>My anomaly protocol</b> — what I will do if one result looks unusual.</li><li><b>My safety routine</b> — hazard, possible harm and control.</li></ol></div>`},
    {k:'know',label:'FINAL AUDIT',heading:'Could another student collect comparable data?',points:['The endpoint is observable rather than based on opinion.','The table matches the IV conditions and DV unit.','Every trial will be recorded immediately and honestly.','The repeat and anomaly rules are written before results are known.']}],
  right:[{k:'html',html:`<div class="lesson-run"><div class="run-row"><div class="run-time">45–48</div><div><b>Retrieve</b><span>Open your Lesson 10 fair-test plan and copy the measurement details.</span></div></div><div class="run-row"><div class="run-time">48–55</div><div><b>Build in OneNote</b><span>Complete all six data-collection headings.</span></div></div><div class="run-row"><div class="run-time">55–58</div><div><b>Audit</b><span>Partner checks endpoint, units, trials, mean and anomaly rule.</span></div></div><div class="run-row"><div class="run-time">58–60</div><div><b>Exit</b><span>Post the protocol in one compressed line.</span></div></div></div>
    <div class="response-call onenote"><div class="response-label">OneNote · durable evidence</div><p>Create <b>Science L11 — Data-collection protocol</b>. Complete all six headings and include your blank table.</p></div><div class="response-call iboard"><div class="response-label">iBoard check 4 · ready-to-measure exit</div><p>Post: <b>start rule / stop rule / unit + precision / repeats / anomaly action</b>.</p></div>`}],
  notes:`<h4>Timing: minutes 45–60</h4><p>45–48 retrieve; 48–55 OneNote; 55–58 peer audit; 58–60 iBoard.</p><h4>Evidence sweep</h4><p>The OneNote page is the durable planning artefact. Use the exit response to find students who still lack a shared endpoint or intend to discard odd results automatically.</p>` });

SLIDES.push({ nav:'L12A — Make your data speak',
  eyebrow:'Week 6 · Lesson 12 · Learn / Read / Notice', eyebrowR:'Lesson 12 · Screen A',
  title:'Choose the graph that matches the question',
  screenlbl:'Student screen 1 of 4', wideLeft:true,
  left:[{k:'read', wow:true, heading:'Bar graph or line graph?', body:['Use a <b>bar graph</b> to compare separate categories, such as sun/shade, wrapped/unwrapped or 0 g/5 g of salt. Use a <b>line graph</b> when the independent variable is a continuous number and you want to show how the dependent variable changes across it—for example, melting time at 0 g, 2 g, 4 g, 6 g and 8 g of salt.','The independent variable belongs on the <b>horizontal x-axis</b>. The dependent variable belongs on the <b>vertical y-axis</b> with its unit. Graph the mean for each condition rather than every trial unless you are asked to show the spread.'],notice:'Graph type follows the data: categories → bars; ordered continuous values → line.'},
    {k:'html',html:`<div class="card cream"><span class="tag try">GRAPH DECISIONS</span><div class="scenario-grid"><div class="scenario-tile"><b>Sun vs shade</b>Bar graph</div><div class="scenario-tile"><b>0, 2, 4, 6, 8 g salt</b>Line graph</div><div class="scenario-tile"><b>x-axis</b>What was changed</div><div class="scenario-tile"><b>y-axis</b>What was measured + unit</div></div></div>`}],
  right:[{k:'html',html:`<div class="lesson-run"><div class="run-row"><div class="run-time">0–4 min</div><div><b>Choose</b><span>Select bar or line for four investigations and justify each choice.</span></div></div><div class="run-row"><div class="run-time">4–8 min</div><div><b>Place variables</b><span>Identify the x-axis, y-axis and unit for each example.</span></div></div><div class="run-row"><div class="run-time">8–12 min</div><div><b>Apply</b><span>Choose the graph for your own investigation and draft both axis labels.</span></div></div><div class="run-row"><div class="run-time">12–15 min</div><div><b>Defend</b><span>Post the decision using the words category or continuous.</span></div></div></div><div class="response-call iboard"><div class="response-label">iBoard check 1 · graph choice</div><p>For your investigation, post: <b>graph type / why / x-axis label / y-axis label + unit</b>.</p></div>`}],
  notes:`<h4>Timing: 15 minutes</h4><p>0–4 graph sort; 4–8 axes; 8–12 apply; 12–15 iBoard.</p><h4>Evidence sweep</h4><p>Most two-condition home tests need a bar graph. Accept a line graph only where ordered numerical IV values are sufficiently numerous and meaningful.</p>` });

SLIDES.push({ nav:'L12B — Graph it & read it',
  eyebrow:'Week 6 · Lesson 12 · Scale / Plot / Audit', eyebrowR:'Lesson 12 · Screen B',
  title:'A graph is a measuring instrument—not decoration',
  screenlbl:'Student screen 2 of 4', wideLeft:true,
  left:[{k:'html',html:`<div class="card cream"><span class="tag do">PLOT THIS SAMPLE</span><table class="dt"><tr><th>Condition</th><th>Mean melting time (s)</th></tr><tr><td>0 g salt</td><td>690</td></tr><tr><td>5 g salt</td><td>510</td></tr></table><div class="option-grid"><div class="option-card"><b>Title</b>Effect of salt on ice-melting time</div><div class="option-card"><b>x-axis</b>Salt condition (g)</div><div class="option-card"><b>y-axis</b>Mean melting time (s)</div><div class="option-card"><b>Scale</b>Equal intervals that include 690</div></div></div>`},
    {k:'read',heading:'Six conventions make the graph readable',body:['Use a specific title, label both axes, include the unit, choose equal scale intervals, plot accurately and keep bars equal in width with gaps between categories. A line graph uses plotted points joined in order.','A scale can mislead when intervals change size or when the axis break exaggerates a small difference. Before drawing, work out the highest value and choose a scale that uses most of the available grid.'],notice:'Every position on an axis must represent a consistent numerical value.'}],
  right:[{k:'html',html:`<div class="lesson-run"><div class="run-row"><div class="run-time">15–19</div><div><b>Plan</b><span>Choose a sensible y-axis maximum and equal intervals for 510 s and 690 s.</span></div></div><div class="run-row"><div class="run-time">19–24</div><div><b>Sketch</b><span>Draw and label the sample bar graph on paper or a OneNote practice space.</span></div></div><div class="run-row"><div class="run-time">24–28</div><div><b>Error hunt</b><span>Find six faults: missing unit, swapped axes, uneven scale, no title, unequal bars and inaccurate height.</span></div></div><div class="run-row"><div class="run-time">28–30</div><div><b>Audit aloud</b><span>State the conventions you would check before accepting a graph.</span></div></div></div><div class="response-call iboard"><div class="response-label">iBoard check 2 · graph audit</div><p>Propose a y-axis scale for the sample, then post <b>six graph conventions</b> a classmate must check.</p></div>`}],
  notes:`<h4>Timing: minutes 15–30</h4><p>15–19 scale; 19–24 sketch; 24–28 error hunt; 28–30 iBoard.</p><h4>Scale guide</h4><p>0–700 s in 100 s intervals is simple and honest. A scale beginning near 500 can exaggerate the visual difference and is less suitable at this level unless an axis break is made explicit.</p>` });

SLIDES.push({ nav:'L12C — Graph clinic',
  eyebrow:'Week 6 · Lesson 12 · Describe / Explain / Conclude', eyebrowR:'Lesson 12 · Screen C',
  title:'Move from “what happened” to “what the evidence means”',
  screenlbl:'Student screen 3 of 4', wideLeft:true,
  left:[{k:'html',html:`<div class="card cream"><span class="tag try">THREE LEVELS OF THINKING</span><p><b>Describe:</b> The 5 g salt condition had a mean melting time of 510 s, which was 180 s less than the 0 g condition.</p><p><b>Explain:</b> Salt promoted melting at the ice surface by lowering water’s freezing point.</p><p><b>Conclude:</b> In this investigation, adding 5 g of salt reduced the mean time for the ice to melt, supporting the prediction.</p></div>`},
    {k:'read',heading:'Claims must stay inside the evidence',body:['A description reports the pattern with numbers. An explanation connects that pattern to a scientific idea. A conclusion answers the testable question and states whether the prediction was supported.','Use cautious language. Two conditions and three trials support a claim about <b>this investigation</b>; they do not prove that every amount of salt will always produce exactly the same effect. “Supported” is usually more scientific than “proved”.'],notice:'Evidence → pattern → scientific reason → answer to the question.'}],
  right:[{k:'html',html:`<div class="lesson-run"><div class="run-row"><div class="run-time">30–34</div><div><b>Separate</b><span>Label statements D (describe), E (explain) or C (conclude).</span></div></div><div class="run-row"><div class="run-time">34–39</div><div><b>Quantify</b><span>Calculate the 180 s difference and express which condition was faster.</span></div></div><div class="run-row"><div class="run-time">39–43</div><div><b>Challenge claims</b><span>Repair “Salt always makes all ice melt 180 seconds faster.”</span></div></div><div class="run-row"><div class="run-time">43–45</div><div><b>Build a paragraph</b><span>Combine description, explanation and conclusion.</span></div></div></div><div class="response-call iboard"><div class="response-label">iBoard check 3 · evidence paragraph</div><p>Using 690 s and 510 s, post three sentences: <b>describe with numbers / explain scientifically / conclude and compare with the prediction</b>.</p></div>`}],
  notes:`<h4>Timing: minutes 30–45</h4><p>30–34 classify; 34–39 quantify; 39–43 limit claims; 43–45 iBoard.</p><h4>Evidence sweep</h4><p>Students often describe twice instead of explaining. The explanation must introduce a relevant mechanism; the conclusion must answer the original question and refer to whether the prediction was supported.</p>` });

SLIDES.push({ nav:'L12D — Read a graph aloud',
  eyebrow:'Week 6 · Lesson 12 · Communicate / Evaluate / Submit', eyebrowR:'Lesson 12 · Screen D',
  title:'Produce a complete evidence story',
  screenlbl:'Student screen 4 of 4', wideLeft:true,
  left:[{k:'html',html:`<div class="card cream"><span class="tag do">ONENOTE EVIDENCE · RESULTS STORY</span><ol style="line-height:1.58;margin:10px 0 0 20px"><li><b>Question and prediction</b></li><li><b>Results table</b> with raw trials, units and means</li><li><b>Graph</b> with title, correct type, labelled axes, units, even scale and accurate plots</li><li><b>Pattern</b> described using comparative numbers</li><li><b>Scientific explanation</b> for the pattern</li><li><b>Conclusion</b> answering the question and judging the prediction</li><li><b>Evidence limit</b> — one reason the claim should remain cautious</li></ol></div>`},
    {k:'know',label:'PEER REVIEW',heading:'Can the evidence be followed?',points:['The numbers agree across the table, calculations, graph and paragraph.','The graph communicates the IV–DV relationship accurately.','Description, explanation and conclusion each do a different job.','The claim is no broader than the investigation supports.']}],
  right:[{k:'html',html:`<div class="lesson-run"><div class="run-row"><div class="run-time">45–48</div><div><b>Assemble</b><span>Bring your question, prediction, table and chosen graph together.</span></div></div><div class="run-row"><div class="run-time">48–55</div><div><b>Create in OneNote</b><span>Complete all seven results-story sections using real or sample data.</span></div></div><div class="run-row"><div class="run-time">55–58</div><div><b>Cross-check</b><span>Partner traces one value from raw trial to mean, graph and conclusion.</span></div></div><div class="run-row"><div class="run-time">58–60</div><div><b>Exit</b><span>Post the evidence chain without looking at the headings.</span></div></div></div><div class="response-call onenote"><div class="response-label">OneNote · durable evidence</div><p>Create <b>Science L12 — Results story</b>. Complete all seven sections using your own results or the sample dataset.</p></div><div class="response-call iboard"><div class="response-label">iBoard check 4 · analysis exit</div><p>Post: <b>graph choice / numerical pattern / scientific reason / prediction supported or not / one evidence limit</b>.</p></div>`}],
  notes:`<h4>Timing: minutes 45–60</h4><p>45–48 assemble; 48–55 OneNote; 55–58 cross-check; 58–60 iBoard.</p><h4>Evidence sweep</h4><p>The OneNote page captures the complete processing-and-analysis product. The exit response reveals who can independently connect representation, pattern, mechanism and claim.</p>` });

SLIDES.push({ nav:'L13A — Part B: Plan',
  eyebrow:'Week 7 · Lesson 13 · Approve / Prepare / Begin', eyebrowR:'Part B · Screen A',
  title:'Part B launch: pass the four gates before testing',
  screenlbl:'Student screen 1 of 4', wideLeft:true,
  left:[{k:'html',html:`<div class="card cream"><span class="tag do">THE FOUR-GATE CHECK</span><div class="option-grid"><div class="option-card"><b>1 · Valid</b>The method actually answers the question; the DV and unit match.</div><div class="option-card"><b>2 · Fair</b>Only the IV changes; key controls are specific.</div><div class="option-card"><b>3 · Measurable</b>Start, endpoint, tool, precision and results table are ready.</div><div class="option-card"><b>4 · Safe</b>Each realistic hazard has a control measure.</div></div></div>`},
    {k:'read',heading:'Approval is scientific—not just administrative',body:['Scientists inspect a plan before collecting data because a poorly designed test can waste materials and produce evidence that cannot answer the question. Once the results are known, changing the question, prediction or rules to fit them would be unfair.','Read the plan as if you were a classmate who had never seen it. Every quantity, condition and action should be clear enough to repeat. If a gate fails, pause and repair the plan before touching the equipment.'],notice:'Plan first, approve second, test third. Never redesign the rules after seeing the answer.'}],
  right:[{k:'html',html:`<div class="lesson-run"><div class="run-row"><div class="run-time">0–3 min</div><div><b>Retrieve</b><span>Open your question, fair-test plan and data-collection protocol from Lessons 9–11.</span></div></div><div class="run-row"><div class="run-time">3–8 min</div><div><b>Gate audit</b><span>Check valid, fair, measurable and safe; mark each green, amber or red.</span></div></div><div class="run-row"><div class="run-time">8–12 min</div><div><b>Repair</b><span>Fix every red or amber item without changing the purpose of the question.</span></div></div><div class="run-row"><div class="run-time">12–15 min</div><div><b>Seek approval</b><span>Post a compact plan for teacher review before practical work.</span></div></div></div><div class="response-call iboard"><div class="response-label">iBoard check 1 · test approval</div><p>Post: <b>question / IV conditions / DV + unit / two key controls / highest risk + control</b>. Finish with <b>READY</b> or name the repair still needed.</p></div>`}],
  notes:`<h4>Timing: 15 minutes</h4><p>0–3 retrieve; 3–8 four-gate audit; 8–12 repairs; 12–15 iBoard approval.</p><h4>Teacher triage</h4><p>Approve only when the IV has clear conditions, the DV has an observable endpoint and unit, the most influential controls are operationalised, and risks are managed. Reply first to red/amber students.</p><h4>Evidence</h4><p>The iBoard post gives a rapid whole-class readiness map. The full plan remains in the booklet/OneNote.</p>` });

SLIDES.push({ nav:'L13B — Part B: Conduct',
  eyebrow:'Week 7 · Lesson 13 · Set up / Rehearse / Check', eyebrowR:'Part B · Screen B',
  title:'A dry run catches problems before the timer starts',
  screenlbl:'Student screen 2 of 4', wideLeft:true,
  left:[{k:'html',html:`<div class="card cream"><span class="tag try">60-SECOND DRY RUN</span><ol style="line-height:1.58;margin:10px 0 0 20px"><li>Lay out every item in method order.</li><li>Show how each sample will start equally.</li><li>Point to the exact IV conditions.</li><li>Say the timer start and stop rules aloud.</li><li>Show where raw data will be written immediately.</li><li>Demonstrate the spill or other risk control.</li></ol></div>`},
    {k:'read',heading:'Set-up decisions can change the result',body:['Equal-looking ice cubes may have different masses. Two trays may be made of different materials. A sunny location can shift into shade during the trial. These are not tiny details: they could provide alternative explanations for the result.','A pilot or dry run checks whether the equipment, timing rule and table work as intended. It is not a hidden first trial. If you collect pilot data, label it clearly and do not mix it with the planned trials unless the procedure was identical.'],notice:'Check the system before collecting evidence. Label pilot data honestly.'}],
  right:[{k:'html',html:`<div class="lesson-run"><div class="run-row"><div class="run-time">15–19</div><div><b>Lay out</b><span>Arrange equipment in method order without beginning the experiment.</span></div></div><div class="run-row"><div class="run-time">19–23</div><div><b>Dry run</b><span>Rehearse sample preparation, timing, endpoint and recording.</span></div></div><div class="run-row"><div class="run-time">23–27</div><div><b>Partner challenge</b><span>Your partner asks one question that exposes a missing quantity or unclear step.</span></div></div><div class="run-row"><div class="run-time">27–30</div><div><b>Final correction</b><span>Record the correction before starting trial 1.</span></div></div></div><div class="response-call iboard"><div class="response-label">iBoard check 2 · pre-flight correction</div><p>Post: <b>one weakness the dry run exposed / the exact correction / which quality it improves—validity, fairness, accuracy or safety</b>.</p></div>`}],
  notes:`<h4>Timing: minutes 15–30</h4><p>15–19 set-up; 19–23 dry run; 23–27 partner challenge; 27–30 iBoard.</p><h4>Remote-learning option</h4><p>If equipment or adult supervision is unavailable, students can perform a spoken/tabletop rehearsal and schedule the practical. Do not encourage unsafe improvisation.</p><h4>Evidence sweep</h4><p>Look for a specific correction, such as weighing 20 g samples or moving both trays to the same surface—not “be more careful”.</p>` });

SLIDES.push({ nav:'L13C — Part B: Run the test',
  eyebrow:'Week 7 · Lesson 13 · Conduct / Observe / Record', eyebrowR:'Part B · Screen C',
  title:'Collect raw data without changing the rules',
  screenlbl:'Student screen 3 of 4', wideLeft:true,
  left:[{k:'html',html:`<div class="card cream"><span class="tag do">LIVE TRIAL ROUTINE</span><div class="option-grid"><div class="option-card"><b>Before</b>Confirm samples, conditions and table row.</div><div class="option-card"><b>Start</b>Apply the agreed rule equally.</div><div class="option-card"><b>Observe</b>Watch without interfering; note relevant changes.</div><div class="option-card"><b>Stop</b>Use the same visible endpoint.</div><div class="option-card"><b>Record</b>Write the raw value immediately with its unit.</div><div class="option-card"><b>Reset</b>Restore controlled conditions before repeating.</div></div></div>`},
    {k:'read',heading:'Raw data is evidence, not a performance',body:['Do not round a time because it “looks nicer”, replace an unexpected value, or adjust the method to make the prediction come true. A prediction can be unsupported and still be scientifically useful.','Record interruptions and unusual events beside the result: a timer stopped, a tray moved into shade, a sample broke or someone touched the ice. These notes help you judge the evidence later.'],notice:'Honest unexpected data is more valuable than tidy invented data.'}],
  right:[{k:'html',html:`<div class="lesson-run"><div class="run-row"><div class="run-time">30–33</div><div><b>Final call</b><span>Read the IV conditions, start rule and endpoint aloud.</span></div></div><div class="run-row"><div class="run-time">33–41</div><div><b>Conduct</b><span>Begin or continue the planned trials; record times and observations live.</span></div></div><div class="run-row"><div class="run-time">41–43</div><div><b>Integrity pause</b><span>Check that no rule has quietly changed between conditions or trials.</span></div></div><div class="run-row"><div class="run-time">43–45</div><div><b>Status report</b><span>Post only data already observed; label incomplete work honestly.</span></div></div></div><div class="response-call iboard"><div class="response-label">iBoard check 3 · live evidence status</div><p>Post: <b>trial completed or in progress / latest raw measurement + unit / one direct observation / any unexpected event</b>. Write <b>none</b> if there was no event.</p></div>`}],
  notes:`<h4>Timing: minutes 30–45</h4><p>30–33 final call; 33–41 practical; 41–43 integrity pause; 43–45 iBoard status.</p><h4>Pacing reality</h4><p>Ice may not melt within this screen. Students should continue safely across the remaining lesson or complete scheduled trials later. The response asks for status, not a fabricated finished result.</p><h4>Teacher monitoring</h4><p>Use live statuses to identify missing units, vague observations and procedural changes while they can still be documented.</p>` });

SLIDES.push({ nav:'L13D — Part B: Secure the evidence',
  eyebrow:'Week 7 · Lesson 13 · Verify / Store / Schedule', eyebrowR:'Part B · Screen D',
  title:'Leave the lesson with an evidence trail',
  screenlbl:'Student screen 4 of 4', wideLeft:true,
  left:[{k:'html',html:`<div class="card cream"><span class="tag do">ONENOTE / BOOKLET EVIDENCE</span><ol style="line-height:1.58;margin:10px 0 0 20px"><li><b>Approved plan</b> — include any correction made after the dry run.</li><li><b>Raw results table</b> — never replace raw values with averages.</li><li><b>Observation log</b> — direct observations and unexpected events.</li><li><b>Photo or labelled set-up diagram</b> — show the two conditions and key controls.</li><li><b>Completion schedule</b> — list unfinished trials and when they will be run safely.</li><li><b>Integrity statement</b> — identify any method change and how it affects comparison.</li></ol></div>`},
    {k:'know',label:'DATA LOCK',heading:'Before calculating anything',points:['Every observed value is recorded with a unit.','Raw trials remain visible even when a mean is later calculated.','Incomplete cells are labelled—not filled from memory or guessed.','Procedural changes and anomalous events are attached to the relevant trial.']}],
  right:[{k:'html',html:`<div class="lesson-run"><div class="run-row"><div class="run-time">45–50</div><div><b>Continue or close safely</b><span>Finish active timing where practical; secure equipment and wipe spills.</span></div></div><div class="run-row"><div class="run-time">50–55</div><div><b>Store evidence</b><span>Transfer the six evidence components to the booklet/OneNote.</span></div></div><div class="run-row"><div class="run-time">55–58</div><div><b>Data audit</b><span>Partner checks raw values, units, notes and unfinished-trial labels.</span></div></div><div class="run-row"><div class="run-time">58–60</div><div><b>Exit</b><span>State what is complete, what remains and the next safe action.</span></div></div></div><div class="response-call onenote"><div class="response-label">OneNote · durable evidence</div><p>Create or update <b>Science L13 — Part B practical evidence</b>. Include all six components; photographs are optional, but a labelled diagram is required if no photo is used.</p></div><div class="response-call iboard"><div class="response-label">iBoard check 4 · evidence handover</div><p>Post: <b>trials completed / trials remaining / one control maintained / one unexpected event or “none” / next action</b>.</p></div>`}],
  notes:`<h4>Timing: minutes 45–60</h4><p>45–50 safely finish/close; 50–55 evidence storage; 55–58 audit; 58–60 iBoard.</p><h4>Evidence sweep</h4><p>This screen prevents invisible unfinished work. Use the exit to distinguish complete data, safely scheduled completion and students needing direct follow-up.</p>` });

SLIDES.push({ nav:'L14A — Part B: Process & graph',
  eyebrow:'Week 7 · Lesson 14 · Verify / Calculate / Preserve', eyebrowR:'Part B · Screen A',
  title:'Process the data without “cleaning away” the truth',
  screenlbl:'Student screen 1 of 4', wideLeft:true,
  left:[{k:'read',heading:'Raw data first, processed data second',body:['Begin with the raw table exactly as recorded. Check that every value has a condition, trial number and unit. Convert all min:s times to total seconds before calculating a mean. Keep the raw values visible beside the mean so a reader can check your working.','Circle an anomaly; do not erase it. Add a note explaining any known event. If a trial is missing, label it missing and complete it if possible—never estimate the value or quietly divide by the planned number of trials.'],notice:'Processing organises evidence; it must not rewrite evidence.'},
    {k:'html',html:`<div class="card cream"><span class="tag try">DATA CHECKSUM</span><div class="scenario-grid"><div class="scenario-tile"><b>Identity</b>Condition + trial</div><div class="scenario-tile"><b>Unit</b>Consistent total seconds</div><div class="scenario-tile"><b>Working</b>Sum ÷ number actually completed</div><div class="scenario-tile"><b>Integrity</b>Raw values and notes preserved</div></div></div>`}],
  right:[{k:'html',html:`<div class="lesson-run"><div class="run-row"><div class="run-time">0–4 min</div><div><b>Completeness check</b><span>Mark each planned trial complete, missing or affected by an event.</span></div></div><div class="run-row"><div class="run-time">4–9 min</div><div><b>Convert</b><span>Change each min:s result into total seconds and show the working.</span></div></div><div class="run-row"><div class="run-time">9–13 min</div><div><b>Calculate</b><span>Find one mean for each condition using completed trials.</span></div></div><div class="run-row"><div class="run-time">13–15 min</div><div><b>Verify</b><span>Post one calculation for teacher checking.</span></div></div></div><div class="response-call iboard"><div class="response-label">iBoard check 1 · calculation proof</div><p>Post one condition’s <b>raw trials / conversion to seconds / sum / division / mean + unit</b>. Label any missing or anomalous value.</p></div>`}],
  notes:`<h4>Timing: 15 minutes</h4><p>0–4 audit; 4–9 convert; 9–13 calculate; 13–15 iBoard proof.</p><h4>Teacher check</h4><p>Verify the divisor equals the number of completed trials and that students have not treated min:s as decimal minutes. Do not let them erase raw values when adding means.</p>` });

SLIDES.push({ nav:'L14B — Part B: Build the graph',

  right:[{k:'html',html:`<div class="lesson-run"><div class="run-row"><div class="run-time">15–18</div><div><b>Plan</b><span>Write graph type, title, axis labels and proposed scale before drawing.</span></div></div><div class="run-row"><div class="run-time">18–25</div><div><b>Construct</b><span>Plot the mean for every condition carefully.</span></div></div><div class="run-row"><div class="run-time">25–28</div><div><b>Convention audit</b><span>Use the six-step list to find omissions or misleading choices.</span></div></div><div class="run-row"><div class="run-time">28–30</div><div><b>Cross-check</b><span>Verify one plotted value against the table and report it.</span></div></div></div><div class="response-call iboard"><div class="response-label">iBoard check 2 · graph proof</div><p>Post: <b>graph type + reason / title / x-axis / y-axis + unit / scale / one table mean matched to its plotted value</b>.</p></div>`}],
  notes:`<h4>Timing: minutes 15–30</h4><p>15–18 plan; 18–25 construct; 25–28 audit; 28–30 iBoard.</p><h4>Evidence sweep</h4><p>Check the graph displays means rather than a mixture of raw trials, axes are not reversed, intervals are equal, and the plotted values agree with the table.</p>` });

SLIDES.push({ nav:'L14C — Part B: Explain & conclude',
  eyebrow:'Week 7 · Lesson 14 · Describe / Explain / Judge', eyebrowR:'Part B · Screen C',
  title:'Write a conclusion that follows the evidence',
  screenlbl:'Student screen 3 of 4', wideLeft:true,
  left:[{k:'html',html:`<div class="card cream"><span class="tag try">CLAIM–EVIDENCE–REASONING</span><p><b>Claim:</b> Answer the investigation question.</p><p><b>Evidence:</b> Compare the condition means using exact values and the difference.</p><p><b>Reasoning:</b> Use heat energy, particle motion, surface area, insulation or freezing point to explain the pattern.</p><p><b>Prediction:</b> State whether it was supported, partly supported or not supported.</p></div>`},
    {k:'read',heading:'A result is not “wrong” because the prediction missed',body:['The purpose of an investigation is to learn from evidence, not to make the prediction win. If the results do not support the prediction, say so and investigate possible scientific or methodological reasons.','Avoid claims such as “This proves salt always melts ice faster.” Your data supports a narrower statement about the conditions and trials you tested. A careful conclusion is stronger than an exaggerated one.'],notice:'Answer the question with numbers, explain the pattern and judge the prediction honestly.'}],
  right:[{k:'html',html:`<div class="lesson-run"><div class="run-row"><div class="run-time">30–34</div><div><b>Claim</b><span>Answer your exact question in one sentence without adding a reason yet.</span></div></div><div class="run-row"><div class="run-time">34–38</div><div><b>Evidence</b><span>Insert both means and calculate their numerical difference.</span></div></div><div class="run-row"><div class="run-time">38–42</div><div><b>Reason</b><span>Explain the pattern with the most relevant science mechanism.</span></div></div><div class="run-row"><div class="run-time">42–45</div><div><b>Prediction judgement</b><span>State supported, partly supported or not supported—and why.</span></div></div></div><div class="response-call iboard"><div class="response-label">iBoard check 3 · CER conclusion</div><p>Post four labelled lines: <b>claim / numerical evidence / scientific reasoning / prediction judgement</b>.</p></div>`}],
  notes:`<h4>Timing: minutes 30–45</h4><p>30–34 claim; 34–38 evidence; 38–42 reasoning; 42–45 iBoard.</p><h4>Teacher feedback</h4><p>Identify whether a weak response is missing numbers, mechanism or alignment with the original question. Do not reward certainty beyond the evidence.</p>` });

  eyebrow:'Week 8 · Lesson 16 · Secure / Prove / Reflect', eyebrowR:'Lesson 16 · Screen D',

  notes:`<h4>Screen D — prove</h4><p>Students work independently first, then peer-check. Run exit check cold.</p><h4>Teacher tip</h4><p>Re-teach if fewer than 75% can state the 15-minute win.</p>` });
